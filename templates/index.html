<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen3.5 智能助手 · 温暖对话</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========== Reset & Base ========== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #F4EFEA;
            --bg-warm: #F0EAE3;
            --surface: #FFFFFF;
            --surface-hover: #FCF9F6;
            --accent: #7C6F64;
            --accent-hover: #6B5F55;
            --accent-light: #E8E2DB;
            --text: #2B2825;
            --text-soft: #8A8580;
            --text-muted: #B0A89E;
            --border: #E8E2DB;
            --shadow-sm: 0 1px 3px rgba(124, 111, 100, 0.06), 0 1px 2px rgba(124, 111, 100, 0.04);
            --shadow-md: 0 4px 16px rgba(124, 111, 100, 0.08), 0 2px 8px rgba(124, 111, 100, 0.04);
            --shadow-lg: 0 8px 32px rgba(124, 111, 100, 0.10), 0 4px 12px rgba(124, 111, 100, 0.06);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition: 400ms cubic-bezier(0.32, 0.72, 0, 1);
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        /* Warm ambient noise overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        /* Warm radial glow */
        body::after {
            content: '';
            position: fixed;
            top: -40%;
            right: -20%;
            width: 800px;
            height: 800px;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle, rgba(196, 168, 130, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* ========== App Container ========== */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1440px;
            height: 90vh;
            height: 90dvh;
            display: flex;
            gap: 12px;
        }

        /* ========== Sidebar ========== */
        .session-sidebar {
            width: 280px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            transition: transform var(--transition), opacity var(--transition);
        }

        .sidebar-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-soft);
            letter-spacing: 0.02em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sidebar-header h3 span {
            font-size: 1rem;
        }

        .new-session-btn {
            width: 100%;
            padding: 10px 16px;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--accent);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            font-family: inherit;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .new-session-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .new-session-btn:active {
            transform: translateY(0);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .session-list::-webkit-scrollbar {
            width: 4px;
        }
        .session-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .session-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .session-item {
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-bottom: 6px;
            transition: all var(--transition);
            border: 1px solid transparent;
            background: transparent;
            position: relative;
        }

        .session-item:hover {
            background: var(--surface-hover);
            border-color: var(--border);
        }

        .session-item.active {
            background: var(--surface-hover);
            border-color: var(--accent-light);
        }

        .session-item.active::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            background: var(--accent);
            border-radius: 0 2px 2px 0;
        }

        .session-name {
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 3px;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
        }

        .session-name .icon {
            flex-shrink: 0;
            font-size: 0.85rem;
        }

        .session-name .label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-time {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-left: 22px;
        }

        .session-delete {
            opacity: 0;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 4px;
            border-radius: 4px;
            transition: opacity var(--transition), background var(--transition);
            flex-shrink: 0;
            line-height: 1;
        }

        .session-item:hover .session-delete {
            opacity: 0.6;
        }

        .session-delete:hover {
            opacity: 1 !important;
            background: rgba(0, 0, 0, 0.05);
        }

        /* ========== Chat Container ========== */
        .chat-container {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            background: var(--surface);
        }

        .header-title h1 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title p {
            font-size: 0.75rem;
            color: var(--text-soft);
            margin-top: 2px;
            font-weight: 400;
        }

        .header-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-hover);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            color: var(--text-soft);
            border: 1px solid var(--border);
            font-family: inherit;
        }

        .header-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #7EC8A0;
        }

        /* ========== System Panel ========== */
        .system-panel {
            padding: 12px 24px;
            background: var(--surface-hover);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .system-panel label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-soft);
            white-space: nowrap;
        }

        .system-input {
            flex: 1;
            min-width: 160px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.82rem;
            outline: none;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .system-input:focus {
            border-color: var(--accent-light);
            box-shadow: 0 0 0 3px rgba(124, 111, 100, 0.08);
        }

        .system-input::placeholder {
            color: var(--text-muted);
        }

        .btn-ghost {
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 500;
            font-family: inherit;
            transition: all var(--transition);
            background: var(--surface);
            color: var(--accent);
            white-space: nowrap;
        }

        .btn-ghost:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-ghost:active {
            transform: scale(0.97);
        }

        .system-hint {
            font-size: 0.68rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* ========== Chat Messages ========== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: var(--surface);
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            animation: messageIn 500ms cubic-bezier(0.32, 0.72, 0, 1) both;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin: 0 10px;
            margin-top: 4px;
        }

        .user .message-avatar {
            order: 2;
            margin-right: 0;
            margin-left: 10px;
            background: var(--accent-light);
        }

        .assistant .message-avatar {
            background: var(--bg);
            border: 1px solid var(--border);
        }

        .message-content {
            max-width: 68%;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 0.88rem;
        }

        .user .message-content {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant .message-content {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        .message-time {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: right;
            padding: 0 2px;
        }

        .user .message-time {
            text-align: right;
        }

        .assistant .message-time {
            text-align: left;
        }

        /* ========== Chat Input ========== */
        .chat-input-area {
            padding: 16px 24px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper textarea {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            background: var(--surface-hover);
            color: var(--text);
            line-height: 1.5;
        }

        .input-wrapper textarea:focus {
            border-color: var(--accent-light);
            box-shadow: 0 0 0 3px rgba(124, 111, 100, 0.08);
            background: var(--surface);
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: var(--accent);
            color: white;
            font-size: 18px;
            transition: all var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Arrow icon in button */
        .send-btn .arrow-icon {
            transition: transform 300ms cubic-bezier(0.32, 0.72, 0, 1);
            display: inline-block;
        }

        .send-btn:hover .arrow-icon {
            transform: translateX(1px) translateY(-1px);
        }

        /* ========== Typing Indicator ========== */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 14px 18px;
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ========== Clear button ========== */
        .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.72rem;
            font-family: inherit;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all var(--transition);
        }

        .clear-btn:hover {
            color: var(--text-soft);
            background: var(--surface-hover);
        }

        /* ========== Responsive ========== */
        @media (max-width: 800px) {
            body {
                padding: 0;
            }

            .app-container {
                height: 100vh;
                height: 100dvh;
                flex-direction: column;
                gap: 0;
                border-radius: 0;
            }

            .session-sidebar {
                width: 100%;
                height: auto;
                max-height: 45vh;
                border-radius: 0;
                box-shadow: none;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }

            .chat-container {
                border-radius: 0;
                box-shadow: none;
                flex: 1;
                min-height: 0;
            }

            .chat-header {
                padding: 14px 16px;
            }

            .system-panel {
                padding: 10px 16px;
            }

            .chat-messages {
                padding: 16px;
            }

            .message-content {
                max-width: 85%;
                font-size: 0.85rem;
            }

            .chat-input-area {
                padding: 12px 16px;
            }

            .system-hint {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .header-title p {
                display: none;
            }
            .header-badge {
                font-size: 0.65rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ====== Sidebar ====== -->
        <div class="session-sidebar">
            <div class="sidebar-header">
                <h3><span>💬</span> 会话列表</h3>
                <button class="new-session-btn" id="sidebarNewSessionBtn">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>
                    新建会话
                </button>
            </div>
            <div class="session-list" id="sessionList">
                <div style="text-align: center; color: var(--text-muted); padding: 24px 16px; font-size: 0.82rem;">加载中...</div>
            </div>
        </div>

        <!-- ====== Chat Main ====== -->
        <div class="chat-container">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-title">
                    <h1>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a10 10 0 0 1 10 10c0 5-3.5 9-10 10C5.5 22 2 17 2 12A10 10 0 0 1 12 2z"/>
                            <path d="M8 10h.01M16 10h.01M9 16a4 4 0 0 0 6 0"/>
                        </svg>
                        Qwen3.5 智能助手
                    </h1>
                    <p>多轮对话 · 记忆上下文 · 可自定义角色</p>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="clear-btn" id="clearHistoryBtn" title="清空当前对话">清空记录</button>
                    <div class="header-badge">
                        <span class="dot"></span>
                        <span id="sessionId">default</span>
                    </div>
                </div>
            </div>

            <!-- System Role Panel -->
            <div class="system-panel">
                <label>🎭 角色设定</label>
                <input type="text" class="system-input" id="systemPromptInput"
                       placeholder="例如：你是一位专业的编程导师，温柔耐心">
                <button class="btn-ghost" id="updateSystemBtn">更新</button>
                <span class="system-hint">💡 设置后 AI 将按此角色回答</span>
            </div>

            <!-- Messages -->
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        你好！我是 Qwen3.5 智能助手，有什么我可以帮助你的吗？
                        <div class="message-time">刚刚</div>
                    </div>
                </div>
            </div>

            <!-- Input -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="输入消息…  (Enter 发送，Shift+Enter 换行)" rows="1"></textarea>
                </div>
                <button class="send-btn" id="sendBtn">
                    <span class="arrow-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== API 配置 ====================
        const API_BASE_URL = "";
        const API_CHAT = "/api/chat";
        const API_HISTORY = "/api/history";
        const API_SESSION = "/api/session";
        const API_SESSIONS = "/api/sessions";

        // ==================== 全局变量 ====================
        let currentSessionId = "default";
        let currentSystemPrompt = "";
        let sessionsList = [];

        // ==================== DOM 元素 ====================
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const sessionIdSpan = document.getElementById('sessionId');
        const systemPromptInput = document.getElementById('systemPromptInput');
        const updateSystemBtn = document.getElementById('updateSystemBtn');
        const sessionListDiv = document.getElementById('sessionList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        // ==================== API 调用 ====================
        async function sendMessage(question) {
            try {
                const requestBody = { session_id: currentSessionId, question };
                if (currentSystemPrompt && currentSystemPrompt.trim()) {
                    requestBody.system_prompt = currentSystemPrompt;
                }
                const response = await fetch(`${API_BASE_URL}${API_CHAT}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data.answer;
            } catch (error) {
                console.error('API 调用失败:', error);
                return `❌ 请求失败: ${error.message}`;
            }
        }

        async function clearHistory(sessionId) {
            try {
                const response = await fetch(`${API_BASE_URL}${API_HISTORY}/${sessionId}`, { method: 'DELETE' });
                return response.ok;
            } catch (error) {
                console.error('清空历史失败:', error);
                return false;
            }
        }

        async function deleteSession(sessionId) {
            try {
                const response = await fetch(`${API_BASE_URL}${API_SESSION}/${sessionId}`, { method: 'DELETE' });
                return response.ok;
            } catch (error) {
                console.error('删除会话失败:', error);
                return false;
            }
        }

        async function updateSystemPrompt(systemPrompt) {
            try {
                const response = await fetch(`${API_BASE_URL}${API_SESSION}/${currentSessionId}/system`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ system_prompt: systemPrompt })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return true;
            } catch (error) {
                console.error('更新系统角色失败:', error);
                return false;
            }
        }

        async function fetchSessionInfo() {
            try {
                const response = await fetch(`${API_BASE_URL}${API_SESSION}/${currentSessionId}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.exists && data.system_prompt) {
                        currentSystemPrompt = data.system_prompt;
                        systemPromptInput.value = currentSystemPrompt;
                    }
                }
            } catch (error) {
                console.error('获取会话信息失败:', error);
            }
        }

        async function fetchSessionsList() {
            try {
                const response = await fetch(`${API_BASE_URL}${API_SESSIONS}`);
                if (response.ok) {
                    const data = await response.json();
                    sessionsList = data.sessions || [];
                    renderSessionList();
                }
            } catch (error) {
                console.error('获取会话列表失败:', error);
            }
        }

        // ==================== UI 操作 ====================
        function renderSessionList() {
            if (sessionsList.length === 0) {
                sessionListDiv.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 24px 16px; font-size: 0.82rem;">暂无会话</div>';
                return;
            }

            sessionListDiv.innerHTML = '';
            sessionsList.forEach(sessionId => {
                const sessionDiv = document.createElement('div');
                sessionDiv.className = `session-item ${sessionId === currentSessionId ? 'active' : ''}`;

                const displayName = sessionId.length > 22
                    ? sessionId.substring(0, 20) + '…'
                    : sessionId;

                sessionDiv.innerHTML = `
                    <div class="session-name">
                        <span class="icon">💬</span>
                        <span class="label">${displayName}</span>
                        <span class="session-delete" data-id="${sessionId}">✕</span>
                    </div>
                    <div class="session-time">${new Date().toLocaleDateString()}</div>
                `;

                sessionDiv.addEventListener('click', (e) => {
                    if (e.target.classList.contains('session-delete')) return;
                    switchSession(sessionId);
                });

                const deleteBtn = sessionDiv.querySelector('.session-delete');
                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (confirm(`确定要删除会话 "${displayName}" 吗？`)) {
                        await deleteSession(sessionId);
                        if (sessionId === currentSessionId) {
                            const remaining = sessionsList.filter(s => s !== sessionId);
                            if (remaining.length > 0) {
                                await switchSession(remaining[0]);
                            } else {
                                await createNewSession();
                            }
                        }
                        await fetchSessionsList();
                    }
                });

                sessionListDiv.appendChild(sessionDiv);
            });
        }

        async function switchSession(newSessionId) {
            currentSessionId = newSessionId;
            sessionIdSpan.textContent = newSessionId.length > 22
                ? newSessionId.substring(0, 20) + '…' : newSessionId;

            chatMessages.innerHTML = '';
            addMessage('assistant', '你好！我是 Qwen3.5 智能助手，有什么我可以帮助你的吗？');

            await fetchSessionInfo();

            document.querySelectorAll('.session-item').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.session-item').forEach(el => {
                const label = el.querySelector('.label');
                if (label && label.textContent.includes(currentSessionId.substring(0, 15))) {
                    el.classList.add('active');
                }
            });
        }

        async function createNewSession() {
            const newSessionId = `session_${Date.now()}_${Math.random().toString(36).substr(2, 8)}`;
            currentSessionId = newSessionId;
            sessionIdSpan.textContent = newSessionId.length > 22
                ? newSessionId.substring(0, 20) + '…' : newSessionId;

            currentSystemPrompt = "";
            systemPromptInput.value = "";

            chatMessages.innerHTML = '';
            addMessage('assistant', '你好！我是 Qwen3.5 智能助手，有什么我可以帮助你的吗？');

            await fetchSessionsList();
        }

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? '👤' : '🤖';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            contentDiv.appendChild(timeDiv);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator() {
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'message assistant';
            indicatorDiv.id = 'typingIndicator';
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            indicatorDiv.appendChild(avatar);
            indicatorDiv.appendChild(indicator);
            chatMessages.appendChild(indicatorDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // ==================== 事件处理 ====================
        async function handleSend() {
            const question = messageInput.value.trim();
            if (!question) return;
            messageInput.value = '';
            messageInput.style.height = 'auto';
            addMessage('user', question);
            showTypingIndicator();
            sendBtn.disabled = true;
            messageInput.disabled = true;
            const answer = await sendMessage(question);
            removeTypingIndicator();
            addMessage('assistant', answer);
            sendBtn.disabled = false;
            messageInput.disabled = false;
            messageInput.focus();
            await fetchSessionsList();
        }

        async function handleUpdateSystem() {
            const newSystemPrompt = systemPromptInput.value.trim();
            if (!newSystemPrompt) {
                alert('请输入系统角色设定');
                return;
            }
            const success = await updateSystemPrompt(newSystemPrompt);
            if (success) {
                currentSystemPrompt = newSystemPrompt;
                addMessage('assistant', `🎭 系统角色已更新为: ${newSystemPrompt.substring(0, 100)}${newSystemPrompt.length > 100 ? '…' : ''}`);
            } else {
                alert('更新系统角色失败');
            }
        }

        function autoResizeTextarea() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        }

        // ==================== 初始化 ====================
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
        messageInput.addEventListener('input', autoResizeTextarea);

        sendBtn.addEventListener('click', handleSend);
        updateSystemBtn.addEventListener('click', handleUpdateSystem);

        clearHistoryBtn.addEventListener('click', async () => {
            if (confirm('确定要清空当前会话的历史记录吗？')) {
                await clearHistory(currentSessionId);
                chatMessages.innerHTML = '';
                addMessage('assistant', '对话历史已清空！有什么我可以帮助你的吗？');
            }
        });

        document.getElementById('sidebarNewSessionBtn').addEventListener('click', async () => {
            await createNewSession();
            await fetchSessionsList();
        });

        messageInput.focus();
        fetchSessionsList();
        fetchSessionInfo();
    </script>
</body>
</html>
